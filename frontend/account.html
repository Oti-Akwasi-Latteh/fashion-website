      <div class="container">
        <div class="auth-box">
            <div class="auth-header">
                <h1 id="auth-title">Sign In</h1>
                <div class="auth-toggle">
                    <button id="signin-btn" class="toggle-btn active">Sign In</button>
                    <button id="login-btn" class="toggle-btn">Login</button>
                </div>
            </div>
            
            <!-- Sign In Form -->
            <form id="signin-form" class="auth-form" >
                <div class="form-group">
                    <input type="text" id="signin-username" placeholder="Username" name="text" required>
                </div>
                <div class="form-group">
                    <input type="email" id="signin-email" placeholder="Email" name="email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signin-password" placeholder="Password" name="password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="signin-confirm-password" placeholder="Confirm Password" name="password" required>
                </div>
                <button type="submit" class="auth-submit-btn">Sign In</button>
            </form>

            <!-- Login Form -->
            <form id="login-form" class="auth-form hidden">
                <div class="form-group">
                    <input type="text" id="login-username" placeholder="Username or Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" placeholder="Password" required>
                </div>
                <button type="submit" class="auth-submit-btn">Login</button>
            </form>
